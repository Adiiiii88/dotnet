name: DXF to SH3D verification

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validation branch
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct and verify source package
        shell: bash
        run: |
          set -euo pipefail
          cat \
            dxf-to-sh3d-ci/payload/source-00.b64 \
            dxf-to-sh3d-ci/payload/source-01-00.b64 \
            dxf-to-sh3d-ci/payload/source-01-01.b64 \
            dxf-to-sh3d-ci/payload/source-01-02.b64 \
            dxf-to-sh3d-ci/payload/source-01-03.b64 \
            dxf-to-sh3d-ci/payload/source-01-04.b64 \
            dxf-to-sh3d-ci/payload/source-02.b64 \
            dxf-to-sh3d-ci/payload/source-03.b64 \
            dxf-to-sh3d-ci/payload/source-04-00.b64 \
            dxf-to-sh3d-ci/payload/source-04-01.b64 \
            dxf-to-sh3d-ci/payload/source-04-02.b64 \
            dxf-to-sh3d-ci/payload/source-04-03.b64 \
            dxf-to-sh3d-ci/payload/source-04-04.b64 \
            | tr -d '\r\n' | base64 --decode > dxf-to-sh3d-source.zip
          echo 'a059069227e9998c109e7c120ddebd3c71b93e844650a426afbf783236c26d62  dxf-to-sh3d-source.zip' | sha256sum --check
          unzip -tq dxf-to-sh3d-source.zip
          mkdir work
          unzip -q dxf-to-sh3d-source.zip -d work
          rm -f work/.nuke
          mkdir -p work/.nuke
          cp -R dxf-to-sh3d-ci/overrides/. work/
          (cd work && patch -p1 < ../dxf-to-sh3d-ci/plan-fixes.patch)
          chmod +x work/build.sh

      - name: Download official Sweet Home 3D 7.5 executable JAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            --output work/tools/SweetHome3D-7.5.jar \
            'https://downloads.sourceforge.net/project/sweethome3d/SweetHome3D/SweetHome3D-7.5/SweetHome3D-7.5.jar'
          test "$(stat -c%s work/tools/SweetHome3D-7.5.jar)" -gt 40000000
          jar tf work/tools/SweetHome3D-7.5.jar >/dev/null

      - name: Run NUKE CI pipeline
        shell: bash
        working-directory: work
        run: |
          set +e
          ./build.sh CI --sweet-home-jar tools/SweetHome3D-7.5.jar 2>&1 | tee /tmp/nuke.log
          status=${PIPESTATUS[0]}
          mkdir -p artifacts
          cp /tmp/nuke.log artifacts/nuke.log
          exit "$status"

      - name: Upload conversion and verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dxf-to-sh3d-results
          path: work/artifacts/
          if-no-files-found: warn
          retention-days: 14
