name: DXF to SH3D .NET 10 verification

on:
  push:
    branches:
      - ai/dxf-to-sh3d-validation-20260722
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Reconstruct source package
        shell: bash
        run: |
          set -euo pipefail
          cat dxf-to-sh3d-source.part* > dxf-to-sh3d-source.b64
          base64 --decode dxf-to-sh3d-source.b64 > dxf-to-sh3d-source.zip
          mkdir dxf-to-sh3d
          unzip -q dxf-to-sh3d-source.zip -d dxf-to-sh3d
          chmod +x dxf-to-sh3d/build.sh
          sha256sum dxf-to-sh3d-source.zip

      - name: Download official Sweet Home 3D 7.5 executable JAR
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 3 \
            --output dxf-to-sh3d/tools/SweetHome3D-7.5.jar \
            'https://sourceforge.net/projects/sweethome3d/files/SweetHome3D/SweetHome3D-7.5/SweetHome3D-7.5.jar/download'
          test -s dxf-to-sh3d/tools/SweetHome3D-7.5.jar
          jar tf dxf-to-sh3d/tools/SweetHome3D-7.5.jar >/dev/null

      - name: Run NUKE CI pipeline
        shell: bash
        working-directory: dxf-to-sh3d
        run: ./build.sh CI

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dxf-to-sh3d-results
          path: dxf-to-sh3d/artifacts/
          if-no-files-found: warn
          retention-days: 14
